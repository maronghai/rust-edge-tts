[package]
name = "edge-tts"
version = "0.1.1"
edition = "2024"
description = "Rust client and CLI for Microsoft Edge online text-to-speech"

[lib]
name = "edge_tts"

[[bin]]
name = "edge-tts"
path = "src/bin/edge-tts.rs"

[[bin]]
name = "edge-playback"
path = "src/bin/edge-playback.rs"

[dependencies]
async-stream = "0.3"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
httpdate = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tokio-socks = "0.5"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Multimedia"] }
